[project]
name = "xevals"
version = "0.1.0"
description = "xevals: multi-dimensional evaluation of robot-learning models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kleyton Costa" }]
keywords = ["evaluation", "benchmark", "robotics", "vla", "world-models", "robustness"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core is numpy and the standard library, and stays that way. Everything a
# particular model, simulator or output format needs is an extra below, imported
# inside the function that needs it so a bare install still imports cleanly.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
torch  = ["torch>=2.2"]
jax    = ["jax>=0.4.38"]
sim    = ["gymnasium>=1.0"]
# The manipulation robots. `robot_descriptions` fetches and caches the MuJoCo
# Menagerie; set XEVALS_MENAGERIE to an existing checkout to skip the download.
mujoco = ["mujoco>=3.2", "robot_descriptions>=1.12"]
# The same scenes stepped by Newton. `newton[sim]` pulls mujoco_warp, which is
# what makes its MuJoCo solver available; without a GPU it falls back to
# Featherstone, which is slower and is why MuJoCo stays the reference backend.
newton = ["newton[sim]>=1.5", "mujoco>=3.2", "robot_descriptions>=1.12"]
lerobot = ["lerobot>=0.1", "pyarrow>=17", "av>=12"]
data   = ["pyarrow>=17", "h5py>=3.11", "av>=12", "huggingface-hub>=0.26"]
video  = ["imageio>=2.34", "imageio-ffmpeg>=0.5", "pillow>=10.0"]
plots  = ["matplotlib>=3.8", "pillow>=10.0"]
# LLM-as-judge and the LLM paraphraser. Rule-based judges are the default, so
# this is genuinely optional -- no suite requires a network call.
judge  = ["anthropic>=0.40", "openai>=1.40"]
xwm    = ["xwm>=0.1"]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "imageio>=2.34",
  "gymnasium>=1.0",
  "mujoco>=3.2",
  "robot_descriptions>=1.12",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[project.scripts]
xevals = "xevals.cli:main"

[project.urls]
Homepage = "https://kamara-lab.github.io/xevals/"
Documentation = "https://kamara-lab.github.io/xevals/"
Repository = "https://github.com/kamara-lab/xevals"
Issues = "https://github.com/kamara-lab/xevals/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xevals"]

# Without this, hatchling sweeps the working tree into the sdist: run directories,
# rendered videos and figures. A source distribution needs the package, the tests
# that specify its behaviour, the examples and the configs -- so it lists those.
[tool.hatch.build.targets.sdist]
only-include = ["xevals", "tests", "examples", "configs", "README.md", "pyproject.toml"]
exclude = ["examples/outputs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
