# Quality gates for every pull request.
#
# Five independent jobs, so one failure tells you which gate broke rather than
# just "CI is red": lint, tests, the *bare* install, the docs build, and the
# package build.
#
# The bare-install job is the one that is easy to leave out and is the whole
# reason the core stays small. `xevals` promises that torch, jax, simulators,
# video codecs and matplotlib fail *when used* and never at import, and a promise
# like that is only true if something checks it on a machine that has none of
# them. It has caught a top-level `import matplotlib` more than once.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the previous run. Pushes to the default
# branch are not cancelled, since those results are what the badge reports.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Ruff only: no need for Python or the package to lint it. The action pulls
      # a prebuilt binary, which is faster than provisioning an interpreter to
      # pip-install one into.
      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

      # Advisory, not a gate. The tree is not ruff-formatted, and reformatting it
      # wholesale would rewrite files the project has not chosen to rewrite.
      - name: ruff format (advisory)
        continue-on-error: true
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check --diff

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # `dev` deliberately excludes torch: the torch tests `importorskip`, and
      # pulling 800 MB of wheels into three interpreters to exercise one adapter
      # is the wrong trade for a suite that otherwise finishes in ten seconds.
      # The torch job below covers it once.
      - name: Install
        run: uv pip install -e ".[dev]"

      - name: pytest
        run: pytest -q -n auto --dist worksteal --durations=10

      # The examples are documentation that runs, so CI runs them -- at two
      # episodes and one seed, which exercises every code path without spending
      # minutes on statistics nobody will read.
      - name: Examples
        env:
          XEVALS_EPISODES: "2"
          XEVALS_SEEDS: "1"
          XEVALS_OUT: ${{ runner.temp }}/xevals-examples
        run: |
          python examples/01_synthetic.py
          python examples/02_state_vs_image.py
          python examples/04_offline_dataset.py
          python examples/05_llm_planner.py
          python examples/06_compare_runs.py
          python examples/07_benchmark.py

      - name: End-to-end from a config
        run: |
          xevals run configs/synthetic.toml run.episodes=2 'run.seeds=[0]' \
            output.dir=${{ runner.temp }}/xevals-cli --quiet
          xevals report ${{ runner.temp }}/xevals-cli/synthetic-*/
          xevals compare ${{ runner.temp }}/xevals-cli/*/

      # The benchmark path is a different handler with its own config shape, so
      # a single-model end-to-end does not cover it.
      # The docs embed real artefacts. Regenerating them here proves the page is
      # not showing output from a version of the library that no longer exists.
      - name: The docs example still generates
        run: |
          python -m tools.make_example_output
          git diff --stat -- docs/assets/example || true

      - name: End-to-end benchmark from a config
        run: |
          xevals run configs/benchmark.toml run.episodes=2 'run.seeds=[0]' \
            output.dir=${{ runner.temp }}/xevals-bench --quiet
          test -f ${{ runner.temp }}/xevals-bench/state-vs-image/leaderboard.md
          test -f ${{ runner.temp }}/xevals-bench/state-vs-image/index.html

  bare:
    name: Bare install (numpy only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install without any extra
        run: uv pip install -e .

      # Importing every module, including the ones named after optional
      # dependencies, must cost nothing. `xevals.plots` and `xevals.media` are the
      # tempting places to put a top-level matplotlib or imageio import.
      - name: Import every module
        run: |
          python -c "import xevals, xevals.adapters, xevals.plots, xevals.media, xevals.report"
          python -c "import xevals; print(xevals.__version__)"

      # Listing a registry must not build anything, so nothing here should be
      # able to reach an optional import.
      - name: Every registry lists without building
        run: |
          python -c "import xevals; print(len(xevals.metrics.available()), 'metrics')"
          python -c "import xevals; print(len(xevals.perturbations.available()), 'perturbations')"
          python -c "import xevals; print(xevals.adapters.available())"
          python -c "import xevals; print(xevals.suites.available())"
          python -c "from xevals.cli import main; raise SystemExit(main(['doctor']))"
          python -c "from xevals.cli import main; raise SystemExit(main(['dimensions']))"
          xevals perturbations list

      # The whole seven-dimension protocol runs on a bare install: the synthetic
      # world exists so that it can. Figures, videos and the report are skipped
      # with a printed note rather than losing the run.
      - name: The full suite, with numpy alone
        run: |
          python - <<'PY'
          import xevals
          from examples.policies import ImagePolicy

          result = xevals.evaluate(
              ImagePolicy(), "synthetic/reach", suite="full",
              episodes=2, seeds=(0,), out=None, verbose=False,
          )
          measured = [d for d, s in result.scores.items() if s is not None]
          print(f"{len(measured)}/7 dimensions measured with numpy alone: {measured}")
          assert len(measured) == 7, result.scores
          PY

  torch:
    name: Torch adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # CPU wheels only. The adapter is what is under test, not the arithmetic.
      - name: Install
        run: |
          uv pip install -e ".[dev]"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: pytest (the torch tests no longer skip)
        run: pytest -q tests/test_adapters.py -k torch --durations=5

      - name: Example
        env:
          XEVALS_EPISODES: "2"
          XEVALS_SEEDS: "1"
          XEVALS_OUT: ${{ runner.temp }}/xevals-examples
        run: python examples/03_torch_policy.py

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # The API reference imports the package, so the docs extra is additive.
      - name: Install
        run: uv pip install -e ".[docs]"

      # --strict fails on a broken link, a bad anchor or an unresolved reference.
      # Missing example figures are stubbed by docs/hooks/figures.py, so a
      # checkout that has never run an example still builds.
      - name: mkdocs build --strict
        run: mkdocs build --strict

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # `uv build` drops a `.gitignore` beside the artifacts. Nothing downstream
      # should have to reason about whether its globs pick up a dotfile.
      - name: Build sdist and wheel
        run: |
          uv build
          rm -f dist/.gitignore

      - name: Check metadata
        run: uvx twine check --strict dist/*

      # A wheel that imports is the minimum bar for a release candidate.
      - name: Install the wheel and import it
        run: |
          uv pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "import xevals; print(xevals.__version__)"
          xevals --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
